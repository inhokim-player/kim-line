<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIM LINE — 일정 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --bg-page:#0a0908; --bg-frame:#0d0c09; --surface-1:#17150f; --surface-2:#1f1c14;
    --border:#2c2818; --border-strong:#463d22; --gold:#c9a227; --gold-bright:#e8c874;
    --silver:#9c9a8f; --text-primary:#f3ead9; --text-secondary:#a89f89; --text-muted:#6e6650;
    --danger:#c9645a; --on-accent:#241d08;
    --radius-card:16px; --font-display:'Noto Serif KR', serif; --font-body:'Noto Sans KR', sans-serif;
  }
  /* 밝은 모드: 토스 스타일 블루·화이트 */
  body.theme-light{
    --bg-page:#f2f4f6; --bg-frame:#ffffff; --surface-1:#f2f4f6; --surface-2:#e8ebee;
    --border:#e5e8eb; --border-strong:#d1d6db; --gold:#3182f6; --gold-bright:#3182f6;
    --silver:#8b95a1; --text-primary:#191f28; --text-secondary:#4e5968; --text-muted:#8b95a1;
    --danger:#f04452; --on-accent:#ffffff;
  }
  body.theme-light .frame{ box-shadow:0 20px 50px rgba(25,31,40,0.12); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg-page); font-family:var(--font-body); color:var(--text-primary); display:flex; justify-content:center; padding:32px 16px; min-height:100vh; }
  .frame{ width:100%; max-width:400px; background:var(--bg-frame); border:1px solid var(--border-strong); border-radius:28px; overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,0.5); min-height:600px; position:relative; }

  .header{ padding:26px 22px 18px; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--border); }
  .brand{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:0.04em; color:var(--gold-bright); }
  .brand-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; letter-spacing:0.03em; }
  .header-icon{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--silver); font-size:16px; }

  .content{ padding:18px 22px 26px; }

  .period-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .period-tab{ flex:1; text-align:center; font-size:12px; color:var(--text-secondary); padding:7px 0; border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  .period-tab.active{ color:var(--gold-bright); border-color:var(--gold); background:rgba(201,162,39,0.08); }

  .month-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .month-label{ font-family:var(--font-display); font-size:15px; color:var(--text-primary); font-weight:600; }
  .month-nav-btn{
    width:44px; height:40px; border-radius:10px;
    background:var(--surface-1); border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary); font-size:20px; font-weight:700; cursor:pointer;
  }
  .month-nav-btn:active{ background:var(--gold); color:var(--on-accent); }

  .avatar{ width:26px; height:26px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; color:var(--gold-bright); flex:none; }

  .section-label{ font-size:12px; color:var(--text-muted); letter-spacing:0.04em; margin:20px 0 10px; text-transform:uppercase; }

  .schedule-item{ display:flex; gap:12px; margin-bottom:10px; }
  .sch-time{ width:48px; flex:none; font-size:12px; color:var(--text-muted); padding-top:12px; }
  .sch-body{ flex:1; background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
  .sch-title{ font-size:13px; color:var(--text-primary); }
  .sch-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .sch-delete{
    margin-left:auto; width:30px; height:30px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border-strong);
    color:var(--text-secondary); font-size:14px; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .sch-delete:hover, .sch-delete:active{ background:var(--danger); color:#fff; border-color:var(--danger); }

  .week-grid{ display:flex; gap:5px; }
  .week-col{ flex:1; min-width:0; cursor:pointer; border-radius:8px; padding:2px; transition:background .15s; }
  .week-col:hover{ background:var(--surface-1); }
  .week-col-head{ text-align:center; font-size:10px; color:var(--text-muted); margin-bottom:6px; }
  .week-col-head.today{ color:var(--gold-bright); font-weight:600; }
  .week-chip{ background:var(--surface-1); border:1px solid var(--border); border-radius:6px; padding:5px 4px; font-size:9px; color:var(--text-secondary); margin-bottom:4px; text-align:center; line-height:1.3; }
  .week-chip.gold{ border-color:var(--border-strong); background:rgba(201,162,39,0.10); color:var(--gold-bright); }

  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .month-dow{ text-align:center; font-size:10px; color:var(--text-muted); padding-bottom:6px; }
  .month-cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; font-size:11px; color:var(--text-secondary); position:relative; cursor:pointer; }
  .month-cell.blank{ visibility:hidden; cursor:default; }
  .month-cell.today{ background:var(--gold); color:var(--on-accent); font-weight:600; }
  .month-cell.picked{ box-shadow:0 0 0 1.5px var(--gold) inset; color:var(--gold-bright); }
  .month-cell .dot{ width:4px; height:4px; border-radius:50%; background:var(--gold-bright); margin-top:3px; }
  .month-cell.today .dot{ background:var(--on-accent); }

  .year-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .year-month{ background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; cursor:pointer; }
  .year-month-label{ font-size:11px; color:var(--text-secondary); margin-bottom:8px; }
  .year-month.current .year-month-label{ color:var(--gold-bright); font-weight:600; }
  .year-bar-track{ height:4px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .year-bar-fill{ height:100%; background:var(--gold); border-radius:3px; }
  .year-month-count{ font-size:9px; color:var(--text-muted); margin-top:6px; }

  /* ---- FAB + 모달 + 토스트 ---- */
  .fab{
    position:absolute; right:22px; bottom:26px; height:40px; padding:0 16px; border-radius:10px;
    background:var(--gold); color:var(--on-accent); border:none; font-size:12px; font-weight:600; cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.4); display:flex; align-items:center; gap:5px; z-index:20;
  }
  .fab i{ font-size:14px; }
  .modal-overlay{ position:absolute; inset:0; background:rgba(5,4,2,0.72); display:none; align-items:flex-end; z-index:30; }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{ width:100%; max-height:88%; overflow-y:auto; background:var(--bg-frame); border-top:1px solid var(--border-strong); border-radius:20px 20px 0 0; padding:22px; }
  .modal-title{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--gold-bright); margin-bottom:16px; }
  .modal-label{ font-size:11px; color:var(--text-muted); margin:14px 0 6px; }
  .modal-input{ width:100%; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 13px; font-size:13px; color:var(--text-primary); font-family:var(--font-body); }

  .picker-box{ background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .picker-summary{ font-size:13px; color:var(--gold-bright); font-weight:600; text-align:center; margin-bottom:10px; }

  .time-selects{ display:flex; gap:8px; }
  .time-select{ flex:1; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:11px 8px; font-size:13px; color:var(--text-primary); font-family:var(--font-body); text-align:center; }

  .modal-actions{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .modal-btn{ padding:16px; border-radius:12px; font-size:14px; cursor:pointer; text-align:center; }
  .modal-btn.confirm{ background:var(--gold); border:none; color:var(--on-accent); font-weight:700; font-size:15px; padding:18px; }
  .modal-btn.cancel{ background:none; border:none; color:var(--text-muted); font-size:12px; padding:4px; }

  .toast{
    position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px);
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-primary);
    font-size:12px; padding:11px 18px; border-radius:20px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:40; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .landing-screen{ padding:40px 24px; text-align:center; min-height:600px; display:flex; flex-direction:column; justify-content:center; }
  .landing-logo{ font-family:var(--font-display); font-size:40px; color:var(--gold-bright); font-weight:700; letter-spacing:0.04em; margin-bottom:14px; }
  .landing-tagline{ font-size:16px; color:var(--text-secondary); margin-bottom:44px; line-height:1.5; }
  .landing-choice-btn{ display:flex; align-items:center; width:100%; text-align:left; background:var(--surface-1); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:16px; cursor:pointer; }
  .landing-choice-title{ font-size:19px; color:var(--text-primary); font-weight:600; }
  .landing-choice-sub{ font-size:14px; color:var(--text-muted); margin-top:5px; }
</style>
</head>
<body class="theme-light">

<div class="frame">

  <!-- ================= 첫 화면: 개인/회사 선택 ================= -->
  <div class="landing-screen" id="landingScreen">
    <div class="landing-logo">KIM LINE</div>
    <div class="landing-tagline">개인과 회사 일정을 한 곳에서 관리하세요</div>

    <input class="modal-input" id="userNameInput" placeholder="이름 또는 닉네임" style="margin-bottom:28px; text-align:center; padding:18px; font-size:16px;">

    <div class="landing-choice-btn" onclick="chooseScope('personal')">
      <div><div class="landing-choice-title">개인 일정</div><div class="landing-choice-sub">본인 개인 일정 관리</div></div>
    </div>
    <div class="landing-choice-btn" onclick="chooseScope('company')">
      <div><div class="landing-choice-title">회사 일정</div><div class="landing-choice-sub">팀·회사 전체 일정 관리</div></div>
    </div>
  </div>

  <div id="appScreen" style="display:none;">
  <div class="header">
    <div>
      <div class="brand">KIM LINE</div>
      <div class="brand-sub" id="headerSub">시범 서비스 · 일정 관리</div>
    </div>
    <div style="display:flex; gap:8px;">
      <div class="header-icon" onclick="toggleTheme()" id="themeToggleBtn"><i class="ti ti-sun"></i></div>
      <div class="header-icon" onclick="goToLanding()" aria-label="뒤로가기" style="color:var(--text-primary); font-size:18px; font-weight:700;">←</div>
    </div>
  </div>

  <div class="content">
    <div class="period-tabs">
      <div class="period-tab active" data-period="day" onclick="switchPeriod('day')">일</div>
      <div class="period-tab" data-period="week" onclick="switchPeriod('week')">주</div>
      <div class="period-tab" data-period="month" onclick="switchPeriod('month')">월</div>
      <div class="period-tab" data-period="year" onclick="switchPeriod('year')">년</div>
    </div>

    <div class="month-nav" id="periodNav">
      <div class="month-nav-btn" onclick="shiftPeriod(-1)" aria-label="이전">←</div>
      <div class="month-label" id="periodLabel">2026년 8월</div>
      <div class="month-nav-btn" onclick="shiftPeriod(1)" aria-label="다음">→</div>
    </div>

    <div id="periodContent"></div>
  </div>

  <button class="fab" onclick="openModal()"><i class="ti ti-plus"></i> 등록</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-title">일정 추가</div>

      <div class="modal-label">제목</div>
      <input class="modal-input" id="modalTitle" placeholder="예: 파트너사 미팅">

      <div class="modal-label">날짜</div>
      <div class="picker-box">
        <div class="picker-summary" id="pickDateSummary">-</div>
        <div class="month-nav" style="margin-bottom:8px;">
          <div class="month-nav-btn" onclick="shiftPickerMonth(-1)" aria-label="이전 달">←</div>
          <div class="month-label" id="pickerMonthLabel" style="font-size:13px;">-</div>
          <div class="month-nav-btn" onclick="shiftPickerMonth(1)" aria-label="다음 달">→</div>
        </div>
        <div class="month-grid" id="pickerCalendar"></div>
      </div>

      <div class="modal-label">시간</div>
      <div class="time-selects">
        <select class="time-select" id="pickAmPm"><option>오전</option><option>오후</option></select>
        <select class="time-select" id="pickHour"></select>
        <select class="time-select" id="pickMinute"></select>
      </div>

      <div class="modal-label">메모</div>
      <input class="modal-input" id="modalMemo" placeholder="예: 강남 사무실">

      <div class="modal-actions">
        <div class="modal-btn confirm" onclick="submitEvent()">일정 등록</div>
        <div class="modal-btn cancel" onclick="closeModal()">취소</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  </div>

</div>

<script>
  const today = new Date(2026, 7, 13); // 2026-08-13 (Thu)
  let currentScope = 'personal';
  let currentPeriod = 'day';
  let viewDate = new Date(today);
  const weekLabels = ["일","월","화","수","목","금","토"];

  function pad(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function startOfWeek(d){ const r = new Date(d); r.setDate(r.getDate() - r.getDay()); return r; }

  // ---- 일정 데이터 (개인 / 회사 분리) ----
  function emptyEventsData(){
    return { personal:{}, company:{} };
  }
  let eventsData = emptyEventsData();

  // ---- 다크/라이트 테마 ----
  function toggleTheme(){
    const isLight = document.body.classList.toggle('theme-light');
    document.getElementById('themeToggleBtn').innerHTML = isLight ? '<i class="ti ti-sun"></i>' : '<i class="ti ti-moon"></i>';
    try{ localStorage.setItem('kimline_theme', isLight ? 'light' : 'dark'); }catch(e){}
  }
  function applyStoredTheme(){
    try{
      if(localStorage.getItem('kimline_theme') === 'dark'){
        document.body.classList.remove('theme-light');
        document.getElementById('themeToggleBtn').innerHTML = '<i class="ti ti-moon"></i>';
      }
      // 기본값(저장된 게 없거나 'light')은 이미 HTML에서 밝은 모드로 시작하므로 별도 처리 불필요
    }catch(e){}
  }
  let currentUser = '';

  function nameStorageKey(name){
    const safeName = name.replace(/[^a-zA-Z0-9가-힣]/g, '_');
    return `kimline_state_v4_${safeName}`;
  }

  function chooseScope(scope){
    const nameInput = document.getElementById('userNameInput').value.trim();
    if(!nameInput){ alert('이름을 입력해주세요'); return; }

    let existing = null;
    try{ existing = localStorage.getItem(nameStorageKey(nameInput)); }catch(e){}
    if(existing){
      const isMe = confirm(`"${nameInput}" 이름은 이미 사용 중이에요.\n본인이 맞으면 확인을 눌러 계속하고, 다른 사람이라면 취소 후 다른 이름을 입력해주세요.`);
      if(!isMe) return;
    }

    currentUser = nameInput;
    currentScope = scope;
    try{ localStorage.setItem('kimline_last_username', currentUser); }catch(e){}
    eventsData = emptyEventsData(); // 이전에 화면에 떠 있던 다른 이름의 데이터가 남지 않도록 완전히 초기화
    loadState(); // 이 이름으로 저장된 데이터가 있으면 불러오고, 없으면 빈 상태로 새로 시작
    document.getElementById('landingScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('headerSub').textContent = `${currentUser}님 · ${scope === 'personal' ? '개인 일정' : '회사 일정'} 관리 중`;
    render();
  }
  function goToLanding(){
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('landingScreen').style.display = 'block';
  }

  // ---- 브라우저 로컬 저장 (이름별로 분리해서 같은 브라우저를 여러 명이 써도 데이터가 안 섞임) ----
  function storageKey(){ return nameStorageKey(currentUser); }
  function saveState(){
    try{ localStorage.setItem(storageKey(), JSON.stringify({ eventsData })); }
    catch(e){ /* 프라이빗 브라우징 등으로 저장 실패 시 무시 */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(storageKey());
      if(!raw) return;
      const parsed = JSON.parse(raw);
      if(parsed.eventsData) eventsData = parsed.eventsData;
    }catch(e){ /* 손상된 경우 기본값 사용 */ }
  }

  // ---- 토스트 ----
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---- 일정 추가 모달 (네이버 캘린더 스타일 날짜/시간 선택) ----
  let pickerDate = new Date(); // 모달 안 달력에서 현재 보고 있는 월
  let selectedDate = new Date(); // 실제 선택된 날짜

  function buildTimeSelectOptions(){
    const hourSel = document.getElementById('pickHour');
    const minSel = document.getElementById('pickMinute');
    hourSel.innerHTML = Array.from({length:12}, (_,i) => i+1).map(h => `<option value="${h}">${h}시</option>`).join('');
    minSel.innerHTML = ['00','10','20','30','40','50'].map(m => `<option value="${m}">${m}분</option>`).join('');
  }

  function renderPickerCalendar(){
    const y = pickerDate.getFullYear(), m = pickerDate.getMonth();
    document.getElementById('pickerMonthLabel').textContent = `${y}년 ${m+1}월`;
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    let html = '';
    weekLabels.forEach(l => html += `<div class="month-dow">${l}</div>`);
    for(let i=0;i<firstDow;i++) html += `<div class="month-cell blank">·</div>`;
    for(let d=1; d<=daysInMonth; d++){
      const cellDate = new Date(y, m, d);
      const isToday = dateKey(cellDate) === dateKey(today);
      const isPicked = dateKey(cellDate) === dateKey(selectedDate);
      const hasEvent = !!(eventsData[currentScope][dateKey(cellDate)] && eventsData[currentScope][dateKey(cellDate)].length);
      html += `<div class="month-cell ${isToday ? 'today' : ''} ${isPicked ? 'picked' : ''}" onclick="pickDate(${y},${m},${d})">${d}${hasEvent ? '<div class="dot"></div>' : ''}</div>`;
    }
    document.getElementById('pickerCalendar').innerHTML = html;
    document.getElementById('pickDateSummary').textContent = `${selectedDate.getFullYear()}년 ${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일 (${weekLabels[selectedDate.getDay()]})`;
  }

  function shiftPickerMonth(dir){
    pickerDate.setMonth(pickerDate.getMonth() + dir);
    renderPickerCalendar();
  }

  function pickDate(y,m,d){
    selectedDate = new Date(y,m,d);
    renderPickerCalendar();
  }

  function openModal(){
    selectedDate = new Date(viewDate);
    pickerDate = new Date(viewDate);
    document.getElementById('modalTitle').value = '';
    document.getElementById('modalMemo').value = '';
    buildTimeSelectOptions();
    document.getElementById('pickAmPm').value = '오전';
    document.getElementById('pickHour').value = '9';
    document.getElementById('pickMinute').value = '00';
    renderPickerCalendar();
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function submitEvent(){
    const title = document.getElementById('modalTitle').value.trim();
    const memo = document.getElementById('modalMemo').value.trim();
    const ampm = document.getElementById('pickAmPm').value;
    let hour = parseInt(document.getElementById('pickHour').value, 10);
    const minute = document.getElementById('pickMinute').value;
    if(!title){ showToast('제목을 입력해주세요'); return; }
    if(ampm === '오후' && hour !== 12) hour += 12;
    if(ampm === '오전' && hour === 12) hour = 0;
    const timeStr = `${pad(hour)}:${minute}`;
    const key = dateKey(selectedDate);
    if(!eventsData[currentScope][key]) eventsData[currentScope][key] = [];
    eventsData[currentScope][key].push({ time: timeStr, icon:"ti-calendar-event", title: title, sub: memo || '메모 없음' });
    eventsData[currentScope][key].sort((a,b) => a.time.localeCompare(b.time));
    saveState();
    closeModal();
    showToast('일정이 추가되었습니다');
    viewDate = new Date(selectedDate);
    switchPeriod('day');
  }

  function deleteEvent(key, idx){
    if(!confirm('이 일정을 삭제할까요?')) return;
    const list = eventsData[currentScope][key];
    if(!list) return;
    list.splice(idx, 1);
    if(list.length === 0) delete eventsData[currentScope][key];
    saveState();
    showToast('일정이 삭제되었습니다');
    render();
  }

  // ---- 캘린더 뷰 ----
  function switchPeriod(period){
    currentPeriod = period;
    document.querySelectorAll('.period-tab').forEach(t => t.classList.toggle('active', t.dataset.period === period));
    render();
  }

  function shiftPeriod(dir){
    if(currentPeriod === 'day') viewDate.setDate(viewDate.getDate() + dir);
    else if(currentPeriod === 'week') viewDate.setDate(viewDate.getDate() + dir*7);
    else if(currentPeriod === 'month') viewDate.setMonth(viewDate.getMonth() + dir);
    else if(currentPeriod === 'year') viewDate.setFullYear(viewDate.getFullYear() + dir);
    render();
  }

  function renderDay(){
    const key = dateKey(viewDate);
    const data = eventsData[currentScope][key] || [];
    document.getElementById('periodLabel').textContent = `${viewDate.getMonth()+1}월 ${viewDate.getDate()}일 (${weekLabels[viewDate.getDay()]})`;
    if(!data.length) return '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:24px 0;">이 날은 등록된 일정이 없습니다.</div>';
    return data.map((item, idx) => `
      <div class="schedule-item">
        <div class="sch-time">${item.time}</div>
        <div class="sch-body">
          ${item.avatar ? `<div class="avatar">${item.avatar}</div>` : ''}
          <div><div class="sch-title">${item.title}</div><div class="sch-sub">${item.sub}</div></div>
          <button class="sch-delete" onclick="deleteEvent('${key}',${idx})" aria-label="일정 삭제"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    `).join('');
  }

  function renderWeek(){
    const start = startOfWeek(viewDate);
    document.getElementById('periodLabel').textContent = `${start.getMonth()+1}월 ${start.getDate()}일 주`;
    let html = '<div class="week-grid">';
    for(let i=0;i<7;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = dateKey(d);
      const isToday = key === dateKey(today);
      const dayEvents = eventsData[currentScope][key] || [];
      html += `<div class="week-col" onclick="jumpToDay(${d.getFullYear()},${d.getMonth()},${d.getDate()})">
        <div class="week-col-head ${isToday ? 'today' : ''}">${weekLabels[i]}<br>${d.getDate()}</div>
        ${dayEvents.map(e => `<div class="week-chip ${isToday ? 'gold' : ''}">${e.title.length > 5 ? e.title.slice(0,5)+'…' : e.title}</div>`).join('') || '<div class="week-chip" style="opacity:0.3;">-</div>'}
      </div>`;
    }
    html += '</div>';
    return html;
  }

  function renderMonth(){
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    document.getElementById('periodLabel').textContent = `${y}년 ${m+1}월`;
    const firstDow = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    let html = '<div class="month-grid">';
    weekLabels.forEach(l => html += `<div class="month-dow">${l}</div>`);
    for(let i=0;i<firstDow;i++) html += `<div class="month-cell blank">·</div>`;
    for(let d=1; d<=daysInMonth; d++){
      const cellDate = new Date(y, m, d);
      const key = dateKey(cellDate);
      const isToday = key === dateKey(today);
      const hasEvent = !!(eventsData[currentScope][key] && eventsData[currentScope][key].length);
      html += `<div class="month-cell ${isToday ? 'today' : ''}" onclick="jumpToDay(${y},${m},${d})">${d}${hasEvent ? '<div class="dot"></div>' : ''}</div>`;
    }
    html += '</div>';
    return html;
  }

  function jumpToDay(y,m,d){
    viewDate = new Date(y,m,d);
    switchPeriod('day');
  }

  function renderYear(){
    const y = viewDate.getFullYear();
    document.getElementById('periodLabel').textContent = `${y}년`;
    let html = '<div class="year-grid">';
    for(let m=0; m<12; m++){
      const isCurrent = (y === today.getFullYear() && m === today.getMonth());
      const count = Object.keys(eventsData[currentScope]).filter(k => k.startsWith(`${y}-${pad(m+1)}`)).length;
      const pct = Math.min(count * 25, 100);
      html += `<div class="year-month ${isCurrent ? 'current' : ''}" onclick="jumpToMonth(${m})">
        <div class="year-month-label">${m+1}월</div>
        <div class="year-bar-track"><div class="year-bar-fill" style="width:${pct}%;"></div></div>
        <div class="year-month-count">${count}건</div>
      </div>`;
    }
    html += '</div>';
    return html;
  }

  function jumpToMonth(m){
    viewDate.setMonth(m);
    switchPeriod('month');
  }

  function render(){
    const el = document.getElementById('periodContent');
    if(currentPeriod === 'day') el.innerHTML = renderDay();
    else if(currentPeriod === 'week') el.innerHTML = renderWeek();
    else if(currentPeriod === 'month') el.innerHTML = renderMonth();
    else if(currentPeriod === 'year') el.innerHTML = renderYear();
  }

  applyStoredTheme();
  try{
    const lastName = localStorage.getItem('kimline_last_username');
    if(lastName) document.getElementById('userNameInput').value = lastName;
  }catch(e){}
</script>

</body>
</html>
